name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Build changelog
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          range=${prev:+$prev..}$GITHUB_REF_NAME
          {
            echo "## Changes"
            echo
            git log --no-merges --pretty='- %s (%h)' "$range"
          } > CHANGELOG.md

      - name: Package plugin
        run: |
          dir=zotero-cite.koplugin
          mkdir -p "dist/$dir"
          cp -r _meta.lua main.lua zoterocite "dist/$dir/"
          (cd dist && zip -r "../$dir-$GITHUB_REF_NAME.zip" "$dir")

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md \
            "zotero-cite.koplugin-$GITHUB_REF_NAME.zip"
